name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    
    # 1. Grant OIDC permissions required for trusted publishing / provenance
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4
      
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
          
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile        
      - run: pnpm --filter savestate build
      - run: pnpm --filter savestate publish --access public --no-git-checks --provenance